<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企微机器人 · 集成管理</title><link rel="stylesheet" href="/static/pingcode.css"><link rel="stylesheet" href="/static/shared-glass.css"><link rel="stylesheet" href="/static/controls.css"><script src="/static/integration-back.js" defer></script><script src="/static/wecom.js" defer></script><script src="/static/account-bar.js" defer></script><link rel="stylesheet" href="/static/account-bar.css"></head>
<body class="pc-page"><main class="pc-container"><nav><a id="wecom-back" data-integration-back href="/">← 返回上一页</a> · 企微机器人</nav><h1>企微机器人</h1><section class="pc-card"><form id="wecom-config"><label>机器人 Webhook<input name="webhook" type="password" autocomplete="new-password" placeholder="粘贴群机器人 Webhook；留空保留已保存配置"></label><label>平台内网地址<input name="report_base_url" type="url" required placeholder="http://192.0.2.20:18089"></label>
<label class="wecom-auto"><span>自动推送报告</span><input name="auto_push" type="checkbox" role="switch" aria-describedby="wecom-auto-help"></label>
<p id="wecom-auto-help" class="pc-muted">开启：任务结束后自动推送最终报告，中间报告不推送；失败、阻塞和未验证项照实保留。关闭：仅在报告页点击“推送到企微”时发送。保存配置后生效，不补发历史报告。</p>
<p class="pc-muted">配置仅对当前账号生效，Webhook 加密保存、不回显。群成员需连接公司内网或 VPN 才能打开报告。</p><div class="pc-actions"><button type="submit" class="pc-primary">保存配置</button><button type="button" id="wecom-test" class="pc-secondary">发送测试消息</button><button type="button" id="wecom-clear" class="pc-secondary">清除配置</button></div><p id="wecom-status" role="status"></p></form></section><details><summary>Webhook 在哪里？</summary><p>进入企业微信群 → 群设置 → 群机器人 → 添加机器人，复制 Webhook 后粘贴到上方。通过“自动推送报告”开关选择自动或手动推送。</p></details></main>
<style>.pc-page .wecom-auto{display:flex;align-items:center;justify-content:space-between;gap:16px}.pc-page .wecom-auto input{appearance:none;display:inline-block;flex:none;width:44px;height:24px;padding:2px;margin:0;border-radius:20px;background:#40506d;cursor:pointer}.pc-page .wecom-auto input:before{content:"";display:block;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .15s}.pc-page .wecom-auto input:checked{background:#4565ef}.pc-page .wecom-auto input:checked:before{transform:translateX(18px)}@media(prefers-reduced-motion:reduce){.pc-page .wecom-auto input:before{transition:none}}</style></body></html>
