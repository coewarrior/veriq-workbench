[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-api-test"
version = "0.17.138"
description = "Generate reviewable API test assets from documents and execute with evidence"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "Pillow>=12.3,<13",
  "urllib3>=2.7,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.20,<5",
  "pytest>=8,<10",
  "allure-pytest>=2.13,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "cryptography>=44,<47",
  "PyMySQL>=1.1,<2",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.3.6,<4",
]

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]
runner = ["playwright>=1.51,<2", "psutil>=6,<8"]

[project.scripts]
api-test = "api_test_tool.cli:main"
api-test-mcp = "api_test_tool.mcp_server:main"
api-test-runner = "api_test_tool.managed_runner:main"

[tool.setuptools.packages.find]
include = ["api_test_tool*"]

[tool.setuptools.package-data]
api_test_tool = ["static/*", "static/**/*"]
