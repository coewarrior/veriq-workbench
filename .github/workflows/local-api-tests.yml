name: Local API tests and web startup

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m pytest tests/unit/test_items_integration.py
      - name: Start the workbench and check the homepage
        run: |
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/veriq-db-password"
          docker run --rm -d --name veriq-test-db -p 127.0.0.1:15432:5432 \
            --mount "type=bind,src=$RUNNER_TEMP/veriq-db-password,dst=/run/secrets/veriq-db-password,readonly" \
            -e POSTGRES_DB=veriq -e POSTGRES_USER=veriq \
            -e POSTGRES_PASSWORD_FILE=/run/secrets/veriq-db-password postgres:17-bookworm
          trap 'docker stop veriq-test-db >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec veriq-test-db pg_isready -h 127.0.0.1 -U veriq -d veriq; then break; fi
            sleep 1
          done
          export API_TEST_DB_HOST=127.0.0.1 API_TEST_DB_PORT=15432
          export API_TEST_DB_PASSWORD_FILE="$RUNNER_TEMP/veriq-db-password"
          python -m api_test_tool.storage_migrate import-sqlite --allow-empty --source "$RUNNER_TEMP/veriq"
          python -m api_test_tool.storage_migrate activate --revision "$GITHUB_SHA"
          python -m api_test_tool web --host 127.0.0.1 --port 18089 --data-dir "$RUNNER_TEMP/veriq" &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; docker stop veriq-test-db >/dev/null' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:18089/healthz
          curl --fail --silent --show-error --location http://127.0.0.1:18089/ -o "$RUNNER_TEMP/veriq-home.html"
          grep -q VERIQ "$RUNNER_TEMP/veriq-home.html"
