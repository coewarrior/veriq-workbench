# 规则必须追溯到原文；本文件不声明用户已批准全部业务预期。
schema_version: '1.0'
title: 五子棋接口测试 MVP：原文规则基线与待确认项
baseline: 现有无冲突接口文档和测试资产；不是新增用户审批。状态码引自已有 YAML / 断言；不读取服务实现或实际响应构造预期。
rules:
- id: R-REG-SUCCESS
  state: documented
  description: 非空的正常新用户注册成功；状态码沿用现有确定用例。
  sources:
  - file: evidence/register_cases.yaml
    anchor: TC-REG-001
  - file: evidence/测试用例.md
    anchor: '| TC-REG-001'
  assertions:
  - kind: status
    expected: 200
  - kind: json_equal
    pointer: ''
    expected:
      reason: 用户注册成功！
      result: true
- id: R-REG-EMPTY
  state: documented
  description: 空值、缺字段和空对象注册返回明确错误；不扩展到null/类型错误。
  sources:
  - file: evidence/register_cases.yaml
    anchor: TC-REG-008
  - file: evidence/register_cases.yaml
    anchor: TC-REG-009
  - file: evidence/register_cases.yaml
    anchor: TC-REG-010
  - file: evidence/register_cases.yaml
    anchor: TC-REG-011
  - file: evidence/register_cases.yaml
    anchor: TC-REG-012
  - file: evidence/register_cases.yaml
    anchor: TC-REG-013
  assertions:
  - kind: status
    expected: 400
  - kind: json_equal
    pointer: ''
    expected: &id001
      reason: 请输入账号/密码
      result: false
- id: R-REG-DUPLICATE
  state: documented
  description: 同一用户第二次注册返回用户名已占用。
  sources:
  - file: evidence/register_cases.yaml
    anchor: TC-REG-007
  assertions:
  - kind: status
    expected: 400
  - kind: json_equal
    pointer: ''
    expected:
      reason: 用户名已被占用！
      result: false
- id: R-REG-CONTENT-TYPE
  state: documented
  description: text/plain表单正文注册返回格式错误。
  sources:
  - file: evidence/register_cases.yaml
    anchor: TC-REG-014
  assertions:
  - kind: status
    expected: 400
  - kind: json_equal
    pointer: ''
    expected:
      reason: 正文格式有问题!
      result: false
- id: R-LOGIN-SUCCESS
  state: documented
  description: 已注册账号密码登录成功并收到SSID Cookie。
  sources:
  - file: evidence/login_cases.yaml
    anchor: TC-LOG-001
  assertions:
  - kind: status
    expected: 200
  - kind: json_equal
    pointer: ''
    expected:
      reason: 用户登录成功！
      result: true
  - kind: cookie_present
    name: SSID
- id: R-LOGIN-EMPTY
  state: documented
  description: 空值或缺字段登录返回明确错误，不扩展到null/类型错误。
  sources:
  - file: evidence/login_cases.yaml
    anchor: TC-LOG-007
  - file: evidence/login_cases.yaml
    anchor: TC-LOG-008
  - file: evidence/login_cases.yaml
    anchor: TC-LOG-009
  - file: evidence/login_cases.yaml
    anchor: TC-LOG-010
  - file: evidence/login_cases.yaml
    anchor: TC-LOG-011
  assertions:
  - kind: status
    expected: 400
  - kind: json_equal
    pointer: ''
    expected: *id001
- id: R-LOGIN-WRONG
  state: documented
  description: 错误密码、未注册用户名、用户名两端额外空格登录失败。
  sources:
  - file: evidence/login_cases.yaml
    anchor: TC-LOG-005
  - file: evidence/login_cases.yaml
    anchor: TC-LOG-006
  - file: evidence/login_cases.yaml
    anchor: TC-LOG-012
  - file: evidence/login_cases.yaml
    anchor: TC-LOG-013
  - file: evidence/login_cases.yaml
    anchor: TC-LOG-014
  assertions:
  - kind: status
    expected: 400
  - kind: json_equal
    pointer: ''
    expected:
      reason: 账号/密码错误!
      result: false
- id: R-INFO-SUCCESS
  state: documented
  description: 信息字段类型来自接口文档，用户名必须与当前登录用户一致；HTTP200沿用已有正向测试断言。
  sources:
  - file: evidence/接口文档.md
    anchor: • `id` int
  - file: evidence/info_cases.yaml
    anchor: TC-INF-002
  - file: evidence/assertions.md
    anchor: assert info_response.status_code == 200
  assertions:
  - kind: status
    expected: 200
  - kind: json_schema
    expected:
      type: object
      required:
      - id
      - score
      - total_count
      - username
      - win_count
      properties:
        id:
          type: integer
        score:
          type: integer
        total_count:
          type: integer
        username:
          type: string
        win_count:
          type: integer
  - kind: equals_variable
    pointer: /username
    variable: username
- id: R-INFO-MISSING-SSID
  state: documented
  description: Cookie内缺少SSID应返回找不到SSID；HTTP400来自已有失败断言。
  sources:
  - file: evidence/测试用例.md
    anchor: '| TC-INF-004'
  - file: evidence/assertions.md
    anchor: assert response.status_code == 400
  assertions:
  - kind: status
    expected: 400
  - kind: json_equal
    pointer: ''
    expected:
      reason: 找不到SSID，请重新登录！
      result: false
- id: R-UNKNOWN-REG-CHARACTERS
  state: needs_review
  description: TC-REG-005/006仅声明不返回500，200或400不构成唯一业务预期，保留待确认。
  sources:
  - file: evidence/register_cases.yaml
    anchor: TC-REG-005
  - file: evidence/register_cases.yaml
    anchor: TC-REG-006
  assertions: []
- id: R-UNKNOWN-TYPES
  state: needs_review
  description: 接口描述字段类型，但未定义null/类型错误的响应；不得以实际返回补预期。
  sources:
  - file: evidence/接口文档.md
    anchor: '| 请求参数 | **请求头：** `Content-Type'
  assertions: []
- id: R-UNKNOWN-INFO-ERROR
  state: needs_review
  description: 资料中信息接口错误集合与测试配置不一致，未选择唯一文案；受影响场景等待规则核对。
  sources:
  - file: evidence/测试用例.md
    anchor: '| TC-INF-003'
  - file: evidence/接口文档.md
    anchor: '**仅三种错误应答：**<br><br>**1. 登录过期'
  assertions: []
- id: R-SSID-QUARANTINE
  state: documented
  description: 已有崩溃记录和停测策略；仅展示，执行器不发送请求。
  sources:
  - file: evidence/quarantine.md
    anchor: '## 当前停测用例说明'
  - file: evidence/缺陷报告.md
    anchor: '## BUG-001'
  - file: evidence/缺陷报告.md
    anchor: '## BUG-003'
  assertions: []
profiles:
- id: registration
  title: 用户注册
  operation_id: post_reg
  variables: &id003
    username:
      kind: unique
      prefix: mvp_
    password:
      kind: unique
      prefix: mvp_
  request:
    json: &id002
      username: ${username}
      password: ${password}
  rule_ids:
  - R-REG-SUCCESS
  generate:
  - id: TC-REG-001
    title: 正常注册新用户
    scenario: normal
  - id: TC-REG-002
    title: 用户名和密码均为1字符
    scenario: custom
    state: NEEDS_RULE
    reason: 固定1字符用户名无法隔离到本轮mvp_数据命名空间，需可独占重置环境与专用清理方案。
    request:
      json:
        username: a
        password: '1'
  - id: TC-REG-003
    title: 注册后用户可用于登录
    scenario: normal
    after_steps:
    - id: login
      operation_id: post_login
      request:
        json: *id002
      rule_ids:
      - R-LOGIN-SUCCESS
  - id: TC-REG-004
    title: 注册空格用户名
    scenario: custom
    state: NEEDS_RULE
    reason: 固定空格用户名无法隔离到本轮mvp_数据命名空间，需可独占重置环境与专用清理方案。
    request:
      json:
        username: ' '
        password: '12'
  - id: TC-REG-005
    title: 特殊字符用户名预期待确认
    scenario: custom
    rule_ids:
    - R-UNKNOWN-REG-CHARACTERS
    request:
      json:
        username: ${username}@#$
        password: ${password}
  - id: TC-REG-006
    title: 256字符用户名预期待确认
    scenario: custom
    rule_ids:
    - R-UNKNOWN-REG-CHARACTERS
    request:
      json:
        username: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        password: ${password}
  - id: TC-REG-007
    title: 重复注册
    scenario: duplicate
    rule_ids:
    - R-REG-DUPLICATE
  - scenario: empty
    title: 注册单字段空值
    fields:
    - username
    - password
    ids:
      username: TC-REG-008
      password: TC-REG-009
    rule_ids:
    - R-REG-EMPTY
  - id: TC-REG-010
    title: 用户名密码均为空
    scenario: custom
    request:
      json:
        username: ''
        password: ''
    rule_ids:
    - R-REG-EMPTY
  - scenario: missing
    title: 注册缺必填字段
    fields:
    - username
    - password
    ids:
      username: TC-REG-011
      password: TC-REG-012
    rule_ids:
    - R-REG-EMPTY
  - id: TC-REG-013
    title: 注册请求体空对象
    scenario: custom
    request:
      json: {}
    rule_ids:
    - R-REG-EMPTY
  - id: TC-REG-014
    title: 注册Content-Type错误
    scenario: custom
    request:
      raw_body: username=${username}&password=${password}
      headers:
        Content-Type: text/plain
    rule_ids:
    - R-REG-CONTENT-TYPE
  - id: TC-REG-015
    title: 并发重复注册同名用户
    scenario: custom
    state: UNSUPPORTED
    reason: 第一版按串行有界请求执行；并发竞争测试保留历史编号，不能以串行重复代替。
  - id: GEN-REG-NULL
    title: 注册null字段预期待确认
    scenario: 'null'
    fields:
    - username
    - password
    rule_ids:
    - R-UNKNOWN-TYPES
  - id: GEN-REG-TYPE
    title: 注册类型错误预期待确认
    scenario: wrong_type
    fields:
    - username
    - password
    rule_ids:
    - R-UNKNOWN-TYPES
- id: login
  title: 用户登录
  operation_id: post_login
  variables: *id003
  request:
    json: *id002
  generate:
  - id: TC-LOG-001
    title: 正确账号密码登录
    scenario: normal
    rule_ids:
    - R-LOGIN-SUCCESS
    setup_steps:
    - id: register
      operation_id: post_reg
      request:
        json: *id002
      rule_ids:
      - R-REG-SUCCESS
  - id: TC-LOG-002
    title: 新注册用户登录
    scenario: normal
    rule_ids:
    - R-LOGIN-SUCCESS
    setup_steps:
    - id: register
      operation_id: post_reg
      request:
        json: *id002
      rule_ids:
      - R-REG-SUCCESS
  - id: TC-LOG-003
    title: 1字符账号密码登录
    scenario: normal
    rule_ids:
    - R-LOGIN-SUCCESS
    state: NEEDS_RULE
    reason: 固定1字符用户名需要独占重置环境和专用清理，当前mvp_隔离策略不覆盖。
    request:
      json:
        username: x
        password: '9'
  - id: TC-LOG-004
    title: 登录后读取本人信息
    scenario: normal
    rule_ids:
    - R-LOGIN-SUCCESS
    setup_steps:
    - id: register
      operation_id: post_reg
      request:
        json: *id002
      rule_ids:
      - R-REG-SUCCESS
    after_steps:
    - id: info
      operation_id: get_info
      rule_ids:
      - R-INFO-SUCCESS
  - id: TC-LOG-005
    title: 密码错误
    scenario: normal
    rule_ids:
    - R-LOGIN-WRONG
    setup_steps:
    - id: register
      operation_id: post_reg
      request:
        json: *id002
      rule_ids:
      - R-REG-SUCCESS
    request:
      json:
        username: ${username}
        password: wrong-password
  - id: TC-LOG-006
    title: 用户名不存在
    scenario: normal
    rule_ids:
    - R-LOGIN-WRONG
  - scenario: empty
    title: 登录单字段空值
    fields:
    - username
    - password
    ids:
      username: TC-LOG-007
      password: TC-LOG-008
    rule_ids:
    - R-LOGIN-EMPTY
  - id: TC-LOG-009
    title: 登录账号密码均为空
    scenario: custom
    request:
      json:
        username: ''
        password: ''
    rule_ids:
    - R-LOGIN-EMPTY
  - scenario: missing
    title: 登录缺必填字段
    fields:
    - username
    - password
    ids:
      username: TC-LOG-010
      password: TC-LOG-011
    rule_ids:
    - R-LOGIN-EMPTY
  - id: TC-LOG-012
    title: 用户名前后空格
    scenario: normal
    rule_ids:
    - R-LOGIN-WRONG
    setup_steps:
    - id: register
      operation_id: post_reg
      request:
        json: *id002
      rule_ids:
      - R-REG-SUCCESS
    request:
      json:
        username: ' ${username} '
        password: ${password}
  - id: TC-LOG-013
    title: 连续10次错误登录均失败
    scenario: normal
    state: NEEDS_RULE
    reason: 基础集默认不执行连续错误登录；保留原历史映射，需单独配置专项次数、停止规则和恢复条件后评审执行。
    rule_ids:
    - R-LOGIN-WRONG
    setup_steps:
    - id: register
      operation_id: post_reg
      request:
        json: *id002
      rule_ids:
      - R-REG-SUCCESS
    request: &id004
      json:
        username: ${username}
        password: wrong-password
    after_steps:
    - id: wrong-login-2
      operation_id: post_login
      request: *id004
      rule_ids: &id005
      - R-LOGIN-WRONG
    - id: wrong-login-3
      operation_id: post_login
      request: *id004
      rule_ids: *id005
    - id: wrong-login-4
      operation_id: post_login
      request: *id004
      rule_ids: *id005
    - id: wrong-login-5
      operation_id: post_login
      request: *id004
      rule_ids: *id005
    - id: wrong-login-6
      operation_id: post_login
      request: *id004
      rule_ids: *id005
    - id: wrong-login-7
      operation_id: post_login
      request: *id004
      rule_ids: *id005
    - id: wrong-login-8
      operation_id: post_login
      request: *id004
      rule_ids: *id005
    - id: wrong-login-9
      operation_id: post_login
      request: *id004
      rule_ids: *id005
    - id: wrong-login-10
      operation_id: post_login
      request: *id004
      rule_ids: *id005
  - id: TC-LOG-014
    title: 未注册账号登录
    scenario: normal
    rule_ids:
    - R-LOGIN-WRONG
  - id: GEN-LOG-NULL
    title: 登录null预期待确认
    scenario: 'null'
    fields:
    - username
    - password
    rule_ids:
    - R-UNKNOWN-TYPES
  - id: GEN-LOG-WRONG_TYPE
    title: 登录wrong_type预期待确认
    scenario: wrong_type
    fields:
    - username
    - password
    rule_ids:
    - R-UNKNOWN-TYPES
- id: info
  title: 用户信息
  operation_id: get_info
  variables: *id003
  generate:
  - id: TC-INF-001
    title: 登录后正常获取信息
    scenario: normal
    rule_ids:
    - R-INFO-SUCCESS
    setup_steps:
    - id: register
      operation_id: post_reg
      request:
        json: *id002
      rule_ids:
      - R-REG-SUCCESS
    - id: login
      operation_id: post_login
      request:
        json: *id002
      rule_ids:
      - R-LOGIN-SUCCESS
  - id: TC-INF-002
    title: 返回数据与登录用户一致
    scenario: normal
    rule_ids:
    - R-INFO-SUCCESS
    setup_steps:
    - id: register
      operation_id: post_reg
      request:
        json: *id002
      rule_ids:
      - R-REG-SUCCESS
    - id: login
      operation_id: post_login
      request:
        json: *id002
      rule_ids:
      - R-LOGIN-SUCCESS
  - id: TC-INF-003
    title: 未携带 Cookie
    scenario: auth_missing
    rule_ids:
    - R-UNKNOWN-INFO-ERROR
    request:
      session: false
  - id: TC-INF-004
    title: Cookie 中缺少 SSID
    scenario: custom
    rule_ids:
    - R-INFO-MISSING-SSID
    variables:
      probe_cookie:
        kind: unique
        prefix: mvp_cookie_
    request:
      session: false
      headers:
        Cookie: probe_cookie=${probe_cookie}
  - id: TC-INF-005
    title: SSID 无效
    scenario: custom
    rule_ids:
    - R-SSID-QUARANTINE
    request:
      session: false
      headers:
        Cookie: SSID=99999999
    state: QUARANTINED
    reason: 已记录SSID崩溃/停测；需要修复证据、确定预期和独立可重置环境后评审恢复。
  - id: TC-INF-006
    title: SSID 为空
    scenario: custom
    rule_ids:
    - R-UNKNOWN-INFO-ERROR
    request:
      session: false
      headers:
        Cookie: SSID=
  - id: TC-INF-007
    title: Cookie 格式错误
    scenario: custom
    rule_ids:
    - R-UNKNOWN-INFO-ERROR
    request:
      session: false
      headers:
        Cookie: invalid_format
  - id: TC-INF-008
    title: SSID 为非数字
    scenario: custom
    rule_ids:
    - R-SSID-QUARANTINE
    request:
      session: false
      headers:
        Cookie: SSID=abc
    state: QUARANTINED
    reason: 已记录SSID崩溃/停测；需要修复证据、确定预期和独立可重置环境后评审恢复。
  - id: TC-INF-009
    title: SSID 为负数
    scenario: custom
    rule_ids:
    - R-SSID-QUARANTINE
    request:
      session: false
      headers:
        Cookie: SSID=-1
    state: QUARANTINED
    reason: 已记录SSID崩溃/停测；需要修复证据、确定预期和独立可重置环境后评审恢复。
  - id: TC-INF-010
    title: SSID 为超大值
    scenario: custom
    rule_ids:
    - R-SSID-QUARANTINE
    request:
      session: false
      headers:
        Cookie: SSID=9999999999999999
    state: QUARANTINED
    reason: 已记录SSID崩溃/停测；需要修复证据、确定预期和独立可重置环境后评审恢复。
  - id: TC-INF-011
    title: 篡改 SSID 尝试越权访问
    scenario: custom
    rule_ids:
    - R-SSID-QUARANTINE
    request:
      session: false
    state: QUARANTINED
    reason: 已记录SSID崩溃/停测；需要修复证据、确定预期和独立可重置环境后评审恢复。
  - id: TC-INF-012
    title: 未登录直接访问
    scenario: auth_missing
    rule_ids:
    - R-UNKNOWN-INFO-ERROR
    request:
      session: false
- id: flow
  title: 业务流程
  operation_id: get_info
  variables: *id003
  generate:
  - id: TC-FLOW-001
    title: 注册→登录→本人信息
    scenario: normal
    setup_steps:
    - id: register
      operation_id: post_reg
      request:
        json: *id002
      rule_ids:
      - R-REG-SUCCESS
    - id: login
      operation_id: post_login
      request:
        json: *id002
      rule_ids:
      - R-LOGIN-SUCCESS
    rule_ids:
    - R-INFO-SUCCESS
  - id: TC-FLOW-002
    title: 未注册登录失败后查信息
    scenario: auth_missing
    setup_steps:
    - id: login
      operation_id: post_login
      request:
        json: *id002
      rule_ids:
      - R-LOGIN-WRONG
    rule_ids:
    - R-UNKNOWN-INFO-ERROR
  - id: TC-FLOW-003
    title: 注册成功未登录查信息
    scenario: auth_missing
    setup_steps:
    - id: register
      operation_id: post_reg
      request:
        json: *id002
      rule_ids:
      - R-REG-SUCCESS
    rule_ids:
    - R-UNKNOWN-INFO-ERROR
